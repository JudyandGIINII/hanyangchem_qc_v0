name: hyc-inspection-p1
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hyc
      POSTGRES_USER: local_user
      POSTGRES_PASSWORD: local-placeholder-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_user -d hyc"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
    ports: ["127.0.0.1:${HYC_POSTGRES_HOST_PORT:-15432}:5432"]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "uv run --project /app/backend alembic -c /app/backend/alembic.ini upgrade head && uv run --project /app/backend uvicorn hyc_api.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://local_user:local-placeholder-only@postgres:5432/hyc
      REDIS_URL: redis://redis:6379/0
      CHECK_DATABASE_ON_READY: "true"
      CHECK_REDIS_ON_READY: "true"
      P3_FIXTURE_MODE: "true"
      P3_STORAGE_ROOT: /tmp/hyc-p3-documents
      P3_FAULT_INJECTION_ENABLED: "false"
      HYC_APP_ROLE: local_user
    tmpfs:
      - /tmp/hyc-p3-documents
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:${HYC_API_HOST_PORT:-18000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--project", "/app/backend", "uvicorn", "hyc_worker.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CHECK_REDIS_ON_READY: "true"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_HYC_PUBLIC_DEMO: ${NEXT_PUBLIC_HYC_PUBLIC_DEMO:-0}
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${HYC_WEB_HOST_PORT:-13000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 12
