[project]
name = "hyc-inspection-foundation"
version = "0.1.0"
description = "Contract-first foundation for Hanyang Chemical inspection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
]
local-ocr = [
    "numpy==2.3.5",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow==12.3.0",
    "pymupdf==1.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "scripts/import_spec_workbook.py",
    "tests/integration/importers/test_spec_workbook_dry_run.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/20260731_0002_p2_domain_invariants.py" = ["E501"]
"tests/integration/db/test_p2_postgres_invariants.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
exclude = "(^|/)scripts/import_spec_workbook\\.py$"

[tool.uv]
package = false
